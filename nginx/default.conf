# server : 하나의 서버설정을 묶는 block
server {
    # listen 80 -> Nginx 컨테이너 내부의 80번 포트에서 요청을 기다림. ip는 docker가 할당하므로 여기서 정하지 않음.
    listen 80;
    # 서버 블록의 호스트 이름을 지정합니다. 실제 도메인이 있다면 다음처럼 작성할 수 있음(server_name news.example.com;)
    # _는 보통 실제 도메인을 지정하지 않는 설정에 사용하는 이름. 모든 도메인을 뜻하는 wildcard가 아님
    server_name _;

    # 외부 /api/ 접두사를 제거하고 같은 Compose 네트워크의 WAS로 전달
    location /api/ {
        # 요청 경로가 /api/로 시작하면 이 블록에서 처리
        proxy_pass http://api:8000/;        # 받은 요청을 Compose의 api, 8000 port로 전달
        # $http_host는 Nginx가 원래 요청의 Host 헤더에서 가져오는 변수임
        proxy_set_header Host $http_host;   # WAS로 전달하는 요청의 Host 헤더를 원래 클라이언트가 요청한 호스트 값으로 설정

        # WAS에 원래 클라이언트의 IP 정보를 전달합니다.
        # WAS 입장에서는 직접 연결한 상대가 Nginx이므로, 원래 요청자를 알려주기 위한 헤더입니다.
        #기존 X-Forwarded-For 값이 있으면 뒤에 접속자의 IP를 추가
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;



        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compose에서 생성 이미지 폴더를 /srv/images에 연결할 예정
    location /images/ {
        alias /srv/images/;
        autoindex off;
    }

    # 참고용 프론트 HTML/CSS/JS 제공
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
