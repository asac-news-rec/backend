<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAI NEWS · 뉴스 피드</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="SAI NEWS 홈">SAI<span>NEWS</span><i></i></a>
    <span class="edition">THE DAILY FEED <span>·</span> LOCAL EDITION</span>
    <a class="docs-link" href="/api/docs" target="_blank" rel="noopener">API 문서 ↗</a>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">새로운 이야기를 만나는 시간</p><h1>오늘의 뉴스<span>.</span></h1>
        <p class="description">최신 소식을 둘러보고, 마음에 드는 기사를 모아보세요.</p></div>
      <div class="edition-mark"><span>SAI</span><small>NEWS ROOM</small></div>
    </section>
    <div class="feed-bar"><h2><span class="live-dot"></span>최신 뉴스</h2><div><span id="count">0개 기사</span><button id="refresh" type="button">새로고침 ↻</button></div></div>
    <p id="status" role="status" aria-live="polite">독자 정보를 준비하고 있습니다.</p>
    <section id="feed" class="feed" aria-label="뉴스 목록" aria-busy="true"></section>
    <div class="load-area"><button id="next" type="button" disabled>뉴스 불러오는 중…</button><p id="page-note"></p></div>
  </main>
  <footer><span>SAI NEWS · 참고용 로컬 프론트</span><span>AI 생성 기사가 포함되어 있습니다.</span>
    <details><summary>내 독자 ID</summary><code id="reader-id">준비 중</code></details>
  </footer>
  <dialog id="article-dialog" aria-labelledby="detail-title"><div class="dialog-top"><span>ARTICLE</span><button id="close-dialog" type="button" aria-label="기사 닫기">닫기 ✕</button></div><div id="detail"></div></dialog>
</body>
</html>
