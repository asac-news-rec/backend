[project]
name = "news-feed-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.2",
    "requests>=2.32,<3",
    "psycopg[binary,pool]==3.3.7",
    "python-dotenv==1.2.4",
    "itsdangerous==2.2.0",
]

[dependency-groups]
# OpenRouter 배치 이미지 전용 의존성
openrouter = [
    "pydantic==2.14.2",
    "requests>=2.32,<3",
    "psycopg[binary]==3.3.7",
    "python-dotenv==1.2.4",
    "pillow==13.0.0",
    "google-cloud-secret-manager>=2.32.0",
    "google-cloud-storage>=3.17.1",
]
# 기사·이미지 생성에 사용하는 패키지
generation = [
    "langchain-anthropic==1.7.9",
    "langchain-core==1.7.4",
    "langchain-ollama==1.1.0",
    "ollama==0.6.3",
    "diffusers==0.42.1",
    "transformers==5.22.1",
    "huggingface-hub==2.4.0",
    "accelerate==1.15.0",
    "torch==2.15.0",
    "pillow==13.0.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
]
test = [
    "pytest>=8,<10",
    "httpx2>=2.16,<3",
]
